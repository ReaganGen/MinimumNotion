[package]
name = "diaspar-core"
description = "Diaspar core: storage, documents and settings. No UI, no network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
log = "0.4.35"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
saphyr = "0.3.3"
serde.workspace = true
similar = { version = "3.2.1", features = ["unicode"] }
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"
uuid = { version = "1.29.0", features = ["v4"] }
xattr = "1.7.0"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
