[package]
name = "forma-ai"
description = "Forma AI: provider adapters and credentials. The only crate with network access."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
forma-core.workspace = true
keyring-core = "1.0.1"
log = "0.4.35"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "json", "native-tls", "stream", "system-proxy"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
tokio-util = "0.7.20"
ts-rs.workspace = true
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
